spring:
  application:
    name: synapsegrid-coordinator
  
  datasource:
    url: jdbc:postgresql://localhost:5432/synapsegrid
    username: synapsegrid
    password: synapsegrid
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: coordinator-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

grpc:
  server:
    port: 9090

server:
  port: 8080

logging:
  level:
    com.synapsegrid: DEBUG
    org.springframework.graphql: DEBUG

